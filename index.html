  </nav>

function lsGet(key, def) { try { const v=localStorage.getItem(key); return v?JSON.parse(v):def; } catch(e) { return def; } }
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

// =====================
// タスクの割り当て(子ども×曜日)
// =====================
function getActiveTasks(child, date) {
  const day = date.getDay();
  return tasks
    .filter(t => (t.childIds==null || t.childIds.includes(child)))
    .filter(t => (t.weekdays==null || t.weekdays.includes(day)))
    .slice()
    .sort((a,b) => (a.order||0) - (b.order||0));
}
function getActiveTasksByCategory(child, date, category) {
  return getActiveTasks(child, date).filter(t => (t.category||"daily")===category);
}

// =====================
// 月間お小遣い・皆勤判定(土日お手伝いポイント/平日タスク)
// =====================
function getMonthlyAllowancePoints(child) {
  const cd = childData[child]||{};
  const ts = cd.taskState||{};
  const monthPrefix = dateKey(new Date()).slice(0,7);
  let points = 0;
  Object.keys(ts).forEach(dateStr => {
    if (!dateStr.startsWith(monthPrefix)) return;
    const dayState = ts[dateStr];
    Object.keys(dayState).forEach(taskId => {
      const entry = dayState[taskId];
      if (!entry.done) return;
      const task = tasks.find(t => String(t.id)===String(taskId));
      if (task && (task.category||"daily")==="chore") points += (task.pts||0);
    });
  });
  return points;
}
function getMonthlyAllowanceYen(child) {
  return getMonthlyAllowancePoints(child) * (settings.ptsRate||0);
}
function getWeekdayPerfectStatus(child) {
  const now=new Date(), year=now.getFullYear(), month=now.getMonth();
  const cd = childData[child]||{};
  const ts = cd.taskState||{};
  let hasAnyWeekday=false, complete=true;
  for (let day=1; day<=now.getDate(); day++) {
    const d = new Date(year,month,day);
    const dow = d.getDay();
    if (dow===0 || dow===6) continue;
    const daily = getActiveTasksByCategory(child, d, "daily");
    if (daily.length===0) continue;
    hasAnyWeekday=true;
    const key = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const dayState = ts[key]||{};
    const done = daily.filter(t=>dayState[t.id]&&dayState[t.id].done).length;
    if (done !== daily.length) complete=false;
  }
  return {complete: hasAnyWeekday && complete, hasAnyWeekday};
}
function isLastDayOfMonth(d) {
  return d.getDate() === new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
}

    return;
  }
  GAS_URL = val;

// =====================
// Sync
// =====================
function setSyncStatus(state, label) {
  const dot = document.getElementById("sync-dot");
  dot.className = "sync-dot" + (state ? " "+state : "");
  document.getElementById("sync-label").textContent = label;
}

function gasRequest(params) {
  return new Promise((resolve, reject) => {
    if (!GAS_URL) { reject(new Error("URL未設定")); return; }
    const cbName = "cb_" + Math.random().toString(36).slice(2);
    const url = GAS_URL + "?" + Object.entries({...params, callback: cbName})
      .map(([k,v]) => encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
    const script = document.createElement("script");
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("タイムアウト"));
    }, 10000);
    window[cbName] = (data) => { cleanup(); resolve(data); };
    function cleanup() { clearTimeout(timer); delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); }
    script.onerror = () => { cleanup(); reject(new Error("接続エラー")); };
    script.src = url;
    document.head.appendChild(script);
  });
}

async function syncLoad() {
  if (!GAS_URL) return;
  setSyncStatus("ing", "読込中...");
  try {
    const data = await gasRequest({action:"load"});
    if (data.tasks) tasks = data.tasks;
    if (data.rewards) rewards = data.rewards;
    if (data.childData) {
      // マージ：ローカルの方が新しい場合はローカル優先（簡易）
      childData = data.childData;
    }
    if (data.settings) settings = data.settings;
    lsSet("tasks", tasks);
    lsSet("rewards", rewards);
    lsSet("childData", childData);
    lsSet("settings", settings);
    setSyncStatus("ok", "同期済み");
    render();
    checkAllDoneForNotify();
    checkMonthlyPerfectForNotify();
  } catch(e) {
    setSyncStatus("err", "エラー");
    console.error(e);
  }
}

async function syncSave() {
  if (!GAS_URL) { lsSet("tasks",tasks); lsSet("rewards",rewards); lsSet("childData",childData); lsSet("settings",settings); return; }
  lsSet("tasks",tasks); lsSet("rewards",rewards); lsSet("childData",childData); lsSet("settings",settings);
  setSyncStatus("ing", "保存中...");
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      await gasRequest({action:"save", data: JSON.stringify({tasks, rewards, childData, settings})});
      setSyncStatus("ok", "同期済み");
    } catch(e) {
      setSyncStatus("err", "ローカル保存");
      console.error(e);
    }
  }, 800);
}

function saveAll() { syncSave(); }

function getDate(o=0) { const d=new Date(); d.setDate(d.getDate()+o); return d; }
function dateKey(d) { return d.toISOString().slice(0,10); }
function formatDate(d) { const days=["日","月","火","水","木","金","土"]; return `${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`; }

function switchPage(page, btn) {
  state.page=page;
  document.querySelectorAll(".page").forEach(el=>el.classList.remove("active"));
  document.getElementById("page-"+page).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(el=>el.classList.remove("active"));
  if(btn) btn.classList.add("active");
  if(page==="parent") syncLoad();
  render();
}
function buildChildTabs(id, active, fn) {
  document.getElementById(id).innerHTML = CHILDREN.map(c =>
    `<button class="child-tab ${c===active?"active":""}" onclick="${fn}('${c}')">${c}</button>`
  ).join("");
}
function switchChild(c){state.child=c;renderKids();}
function switchCalChild(c){state.calChild=c;renderCalendar();}
function changeDate(d){state.dateOffset+=d;if(state.dateOffset>0)state.dateOffset=0;renderKids();}

function getTS(child,taskId,offset){
  const key=dateKey(getDate(offset));
  if(!childData[child])childData[child]={stamp:DEFAULT_STAMPS[child]||"⭐",history:{},taskState:{}};
  if(!childData[child].taskState[key])childData[child].taskState[key]={};
  if(!childData[child].taskState[key][taskId])childData[child].taskState[key][taskId]={done:false,parentChecked:false};
  return childData[child].taskState[key][taskId];
}
function toggleTask(child,taskId){
  const ts=getTS(child,taskId,state.dateOffset);
  const task=tasks.find(t=>t.id===taskId);
  if(!task)return;
  ts.done=!ts.done;
  if(!ts.done){ts.parentChecked=false;}
  saveHistory(child); saveAll(); renderKids();
  checkAllDoneForNotify();
  checkMonthlyPerfectForNotify();
}
function parentCheck(child,taskId){
  const ts=getTS(child,taskId,0);
  if(!ts.done)return;
  ts.parentChecked=!ts.parentChecked;
  saveAll(); renderParent();
}
function setStamp(child,s){childData[child].stamp=s;saveAll();renderKids();}
function saveHistory(child){
  const d=getDate(state.dateOffset), key=dateKey(d);
  const ts=childData[child].taskState[key]||{};
  const active=getActiveTasksByCategory(child,d,"daily");
  const total=active.length, done=active.filter(t=>ts[t.id]&&ts[t.id].done).length;
  childData[child].history[key]={done,total,full:done===total&&total>0};
}

function render(){
  if(state.page==="kids")renderKids();
  else if(state.page==="parent")renderParent();
  else if(state.page==="calendar")renderCalendar();
  else if(state.page==="rewards")renderRewards();
  else if(state.page==="settings")renderSettings();
}
function renderKids(){
  buildChildTabs("child-tabs",state.child,"switchChild");
  const child=state.child, cd=childData[child]||{};
  const d=getDate(state.dateOffset), dayKey=dateKey(d);
  const ts=(cd.taskState||{})[dayKey]||{};
  const dailyTasks=getActiveTasksByCategory(child,d,"daily");
  const choreTasks=getActiveTasksByCategory(child,d,"chore");
  const total=dailyTasks.length, done=dailyTasks.filter(t=>ts[t.id]&&ts[t.id].done).length;
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById("date-label").textContent=state.dateOffset===0?`今日 ${formatDate(d)}`:formatDate(d);
  document.getElementById("pts-name").textContent=`${child}の今日のすすみぐあい`;
  document.getElementById("prog-fill").style.width=pct+"%";
  document.getElementById("pts-ratio").textContent=`${done}/${total}`;
  document.getElementById("done-banner").style.display=(total>0&&done===total)?"block":"none";
  document.getElementById("task-list").innerHTML=dailyTasks.map(t=>{
    const tstate=getTS(child,t.id,state.dateOffset);
    return `<div class="task-card ${tstate.done?"done":""} ${tstate.parentChecked?"parent-ok":""}" onclick="toggleTask('${child}',${t.id})">
      <div class="stamp-circle ${tstate.done?"done":""}">${tstate.done?(cd.stamp||"⭐"):"○"}</div>
      <div class="task-info">

        <div class="task-sub">${tstate.parentChecked?"✓確認済み":""}</div>

  }).join("");
  document.getElementById("stamp-picker").innerHTML=STAMPS_ALL.map(s=>
    `<div class="stamp-opt ${(cd.stamp||"⭐")===s?"selected":""}" onclick="setStamp('${child}','${s}')">${s}</div>`

      const tstate=getTS(child,t.id,state.dateOffset);

        <div class="chore-check ${tstate.done?"done":""}">${tstate.done?"✔":"○"}</div>
        <div class="chore-name ${tstate.done?"done":""}">${t.name}</div>
        <div class="chore-pt-badge">+${t.pts||1}pt</div>
      </div>`;
    }).join("");
  }
}
function renderParent(){
  const todayDate=getDate(0), today=dateKey(todayDate);
  const parentRow=(child,ts,t)=>{
    const s=ts[t.id]||{done:false,parentChecked:false};
    const icon=s.done?(s.parentChecked?"✅":"⏳"):"◻️";
    return `<div class="parent-row">
      <div class="parent-task-name">${t.name}</div>
      <div class="parent-status">${icon}</div>
      ${s.done&&!s.parentChecked?`<button class="verify-btn" onclick="parentCheck('${child}',${t.id})">確認</button>`:""}
      ${s.parentChecked?`<span class="verified-label">確認済み</span>`:""}
      ${!s.done?`<span class="undone-label">未完了</span>`:""}
    </div>`;
  };
  document.getElementById("parent-list").innerHTML=CHILDREN.map(child=>{
    const cd=childData[child]||{};
    const ts=(cd.taskState||{})[today]||{};
    const dailyTasks=getActiveTasksByCategory(child,todayDate,"daily");
    const choreTasks=getActiveTasksByCategory(child,todayDate,"chore");
    return `<div class="parent-card">
      <div class="parent-child-header">${child}</div>
      ${dailyTasks.map(t=>parentRow(child,ts,t)).join("")}
      ${choreTasks.length?`<div class="parent-sub-header">🏠 お手伝い</div>${choreTasks.map(t=>parentRow(child,ts,t)).join("")}`:""}
    </div>`;
  }).join("");
}
function renderCalendar(){
  buildChildTabs("cal-child-tabs",state.calChild,"switchCalChild");
  const child=state.calChild, cd=childData[child]||{history:{}};
  const now=new Date(), year=now.getFullYear(), month=now.getMonth();
  document.getElementById("cal-month-label").textContent=`${year}年${month+1}月の記録`;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDay=new Date(year,month,1).getDay();
  const dayLabels=["日","月","火","水","木","金","土"];
  let html=dayLabels.map(d=>`<div class="cal-day-label">${d}</div>`).join("");
  for(let i=0;i<firstDay;i++) html+="<div></div>";
  for(let day=1;day<=daysInMonth;day++){
    const key=`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const h=(cd.history||{})[key];
    const isToday=day===now.getDate();
    let cls="cal-cell"+(h?(h.full?" full":" partial"):" empty-day")+(isToday?" today":"");
    html+=`<div class="${cls}">${day}</div>`;
  }
  document.getElementById("cal-grid").innerHTML=html;
  const hist=cd.history||{};
  const fullDays=Object.values(hist).filter(h=>h.full).length;
  const totalDays=Object.keys(hist).length;
  document.getElementById("month-stats").innerHTML=`
    <div class="stat-card"><div class="stat-val">${fullDays}</div><div class="stat-label">全完了日数</div></div>
    <div class="stat-card"><div class="stat-val">${totalDays}</div><div class="stat-label">記録日数</div></div>
    <div class="stat-card"><div class="stat-val">${getMonthlyAllowanceYen(child)}円</div><div class="stat-label">今月のお小遣い</div></div>`;
  const perfect=getWeekdayPerfectStatus(child);
  const badge=document.getElementById("streak-badge");
  if(!perfect.hasAnyWeekday){
    badge.innerHTML="";
  } else if(isLastDayOfMonth(now) && perfect.complete){
    badge.innerHTML=`<div class="streak-badge complete">🏆 今月は平日タスク皆勤達成!ご褒美をあげよう!</div>`;
  } else if(perfect.complete){
    badge.innerHTML=`<div class="streak-badge progress">🏅 今月は平日タスク達成中!このまま頑張ろう</div>`;
  } else {
    badge.innerHTML="";
  }
}
function renderRewards(){
  document.getElementById("reward-list").innerHTML=rewards.map(r=>
    `<div class="reward-card-simple">
      <div class="reward-icon">${r.icon}</div>
      <div class="reward-name">${r.name}</div>
    </div>`
  ).join("");
}
const WEEKDAY_LABELS=["日","月","火","水","木","金","土"];
function tasksByCategory(category){
  return tasks.filter(t=>(t.category||"daily")===category).slice().sort((a,b)=>(a.order||0)-(b.order||0));
}
function renderTaskCard(t,i,sorted,isChore){
  const childIds=t.childIds==null?CHILDREN:t.childIds;
  const weekdays=t.weekdays==null?ALL_WEEKDAYS:t.weekdays;
  return `<div class="task-settings-card">
    <div class="tsc-row1">
      <button class="tsc-handle" onclick="moveTask(${t.id},-1)" ${i===0?"disabled":""}>▲</button>
      <button class="tsc-handle" onclick="moveTask(${t.id},1)" ${i===sorted.length-1?"disabled":""}>▼</button>
      <input type="text" value="${t.name}" id="tn-${t.id}" placeholder="${isChore?"お手伝い名":"タスク名"}" style="flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;background:var(--surface-1);color:var(--text-primary);min-width:0;"/>
      ${isChore?`<input type="number" value="${t.pts||1}" id="tp-${t.id}" min="1" max="99" style="width:52px;padding:7px 6px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;background:var(--surface-1);color:var(--text-primary);text-align:right;"/><span class="pts-ratio">pt</span>`:""}
      <button class="del-btn" onclick="${isChore?"delChore":"delTask"}(${t.id})">🗑</button>
    </div>
    <div class="chip-row">
      ${CHILDREN.map(c=>`<div class="chip ${childIds.includes(c)?"on":""}" onclick="toggleTaskChild(${t.id},'${c}')">${c}</div>`).join("")}
    </div>
    <div class="chip-row">
      ${WEEKDAY_LABELS.map((label,day)=>`<div class="chip ${weekdays.includes(day)?"on":""}" onclick="toggleTaskWeekday(${t.id},${day})">${label}</div>`).join("")}
    </div>
  </div>`;
}
function renderSettings(){
  const dailySorted=tasksByCategory("daily");
  document.getElementById("task-settings").innerHTML=dailySorted.map((t,i)=>renderTaskCard(t,i,dailySorted,false)).join("");
  const choreSorted=tasksByCategory("chore");
  document.getElementById("chore-settings").innerHTML=choreSorted.map((t,i)=>renderTaskCard(t,i,choreSorted,true)).join("");
  document.getElementById("reward-settings").innerHTML=rewards.map(r=>
    `<div class="settings-row">
      <input type="text" value="${r.icon}" id="ri-${r.id}" style="width:48px;text-align:center;" placeholder="🎁"/>
      <input type="text" value="${r.name}" id="rn-${r.id}" placeholder="できること"/>
      <button class="del-btn" onclick="delReward(${r.id})">🗑</button>
    </div>`
  ).join("");
  document.getElementById("pts-rate-input").value=settings.ptsRate;
}
function commitSettingsInputs(){
  tasks.forEach(t=>{
    const nameEl=document.getElementById(`tn-${t.id}`);
    if(nameEl) t.name=nameEl.value.trim()||t.name;
    if((t.category||"daily")==="chore"){
      const ptsEl=document.getElementById(`tp-${t.id}`);
      if(ptsEl){ const v=parseInt(ptsEl.value); if(!isNaN(v)) t.pts=v; }
    }
  });
  rewards.forEach(r=>{
    const iconEl=document.getElementById(`ri-${r.id}`);
    if(iconEl) r.icon=iconEl.value.trim()||r.icon;
    const nameEl=document.getElementById(`rn-${r.id}`);
    if(nameEl) r.name=nameEl.value.trim()||r.name;
  });
  const rateEl=document.getElementById("pts-rate-input");
  if(rateEl){ const v=parseInt(rateEl.value); if(!isNaN(v)) settings.ptsRate=v; }
}
function toggleTaskChild(id,child){
  commitSettingsInputs();
  const t=tasks.find(x=>x.id===id); if(!t)return;
  let childIds=(t.childIds==null?CHILDREN:t.childIds).slice();
  if(childIds.includes(child)) childIds=childIds.filter(c=>c!==child);
  else childIds.push(child);
  t.childIds=childIds;
  renderSettings();
}
function toggleTaskWeekday(id,day){
  commitSettingsInputs();
  const t=tasks.find(x=>x.id===id); if(!t)return;
  let weekdays=(t.weekdays==null?ALL_WEEKDAYS:t.weekdays).slice();
  if(weekdays.includes(day)) weekdays=weekdays.filter(d=>d!==day);
  else weekdays.push(day);
  t.weekdays=weekdays;
  renderSettings();
}
function moveTask(id,dir){
  commitSettingsInputs();
  const t=tasks.find(x=>x.id===id); if(!t)return;
  const sorted=tasksByCategory(t.category||"daily");
  const idx=sorted.findIndex(x=>x.id===id);
  const swapIdx=idx+dir;
  if(idx<0||swapIdx<0||swapIdx>=sorted.length)return;
  [sorted[idx],sorted[swapIdx]]=[sorted[swapIdx],sorted[idx]];
  sorted.forEach((t,i)=>t.order=i+1);
  renderSettings();
}
function addTask(){
  commitSettingsInputs();
  const maxOrder=tasksByCategory("daily").reduce((m,t)=>Math.max(m,t.order||0),0);
  tasks.push({id:nextTaskId(),name:"新しいタスク",order:maxOrder+1,childIds:CHILDREN.slice(),weekdays:ALL_WEEKDAYS.slice(),category:"daily",pts:1});
  renderSettings();
}
function delTask(id){commitSettingsInputs();tasks=tasks.filter(t=>t.id!==id);renderSettings();}
function addChore(){
  commitSettingsInputs();
  const maxOrder=tasksByCategory("chore").reduce((m,t)=>Math.max(m,t.order||0),0);
  tasks.push({id:nextTaskId(),name:"新しいお手伝い",order:maxOrder+1,childIds:CHILDREN.slice(),weekdays:ALL_WEEKDAYS.slice(),category:"chore",pts:1});
  renderSettings();
}
function delChore(id){commitSettingsInputs();tasks=tasks.filter(t=>t.id!==id);renderSettings();}
function addReward(){commitSettingsInputs();rewards.push({id:nextRewardId(),name:"新しいできること",icon:"🎁"});renderSettings();}
function delReward(id){commitSettingsInputs();rewards=rewards.filter(r=>r.id!==id);renderSettings();}
function saveSettings(){
  commitSettingsInputs();
  tasks=tasks.filter(t=>t.name);
  rewards=rewards.filter(r=>r.name);
  saveAll();
  const msg=document.getElementById("save-msg");
  msg.style.display="block";
  setTimeout(()=>msg.style.display="none",2000);
  renderSettings();
}

// =====================
// 通知(親向け)
// =====================
function notifiedKey(child,dateStr){return "notified_"+child+"_"+dateStr;}
function updateNotifyUI(){
  const btn=document.getElementById("notify-btn"), status=document.getElementById("notify-status");
  if(!("Notification" in window)){
    btn.textContent="この端末は通知に対応していません"; btn.disabled=true; return;
  }
  if(Notification.permission==="granted"){
    btn.textContent="🔔 通知は有効です"; btn.classList.add("on"); btn.disabled=true;
    status.textContent="このアプリを開いている間、子どもが今日のタスクを全部終えたときに通知します。";
  } else if(Notification.permission==="denied"){
    btn.textContent="通知がブロックされています"; btn.disabled=true;
    status.textContent="端末のブラウザ設定で通知を許可してください。";
  } else {
    btn.textContent="🔔 通知を有効にする"; btn.disabled=false;
    status.textContent="アプリを開いている間、子どもが今日のタスクを全部終えたときに通知します。";
  }
}
function enableNotifications(){
  if(!("Notification" in window)){ alert("この端末は通知に対応していません"); return; }
  Notification.requestPermission().then(p=>{
    updateNotifyUI();
    if(p==="granted"){ startNotifyPolling(); checkAllDoneForNotify(); checkMonthlyPerfectForNotify(); }
  });
}
function startNotifyPolling(){
  if(notifyPollTimer) return;
  notifyPollTimer=setInterval(()=>{ if(state.page!=="settings") syncLoad(); checkAllDoneForNotify(); checkMonthlyPerfectForNotify(); }, 60000);
}
function checkAllDoneForNotify(){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  const todayDate=getDate(0), today=dateKey(todayDate);
  CHILDREN.forEach(child=>{
    const cd=childData[child]||{};
    const active=getActiveTasksByCategory(child,todayDate,"daily");
    if(active.length===0) return;
    const ts=(cd.taskState||{})[today]||{};
    const done=active.filter(t=>ts[t.id]&&ts[t.id].done).length;
    const key=notifiedKey(child,today);
    if(done===active.length){
      if(!lsGet(key,false)){
        new Notification(`${child}さんの今日のタスクが全部おわりました！`);
        lsSet(key,true);
      }
    } else {
      if(lsGet(key,false)) lsSet(key,false);
    }
  });
}
function monthlyPerfectKey(child,monthStr){return "monthlyPerfect_"+child+"_"+monthStr;}
function checkMonthlyPerfectForNotify(){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  const now=getDate(0);
  if(!isLastDayOfMonth(now)) return;
  const monthStr=dateKey(now).slice(0,7);
  CHILDREN.forEach(child=>{
    const status=getWeekdayPerfectStatus(child);
    if(!status.hasAnyWeekday || !status.complete) return;
    const key=monthlyPerfectKey(child,monthStr);
    if(!lsGet(key,false)){
      new Notification(`🏆 ${child}さん、今月は平日タスク皆勤達成でした!ご褒美をあげよう!`);
      lsSet(key,true);
    }
  });
}

initUrlSetup();
render();
updateNotifyUI();
if("Notification" in window && Notification.permission==="granted"){
  startNotifyPolling();
}
</script>
