.section-header { padding: 14px 16px 8px; font-size: 15px; font-weight: 700; }

.settings-wrap { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }

  </div>

      <div class="cal-grid" id="cal-grid"></div>

        <div class="legend-item"><div class="legend-dot" style="background:#FFFBEB;border:1px solid #D97706;"></div>全完了</div>

      </div>
      <div class="stats-grid" id="month-stats"></div>
    </div>
  </div>

  <div class="page" id="page-rewards">
    <div class="child-tabs" id="reward-child-tabs"></div>
    <div style="padding:12px 16px;display:flex;align-items:center;gap:8px;">

    </div>
    <div class="reward-list" id="reward-list"></div>
  </div>

  <div class="page" id="page-settings">
    <div class="section-header">設定</div>
    <div class="settings-wrap">
      <div class="settings-card">
        <div class="settings-card-header">タスク一覧</div>
        <div id="task-settings"></div>
        <button class="add-row-btn" onclick="addTask()">＋ タスクを追加</button>
      </div>
      <div class="settings-card">
        <div class="settings-card-header">ごほうび一覧</div>
        <div id="reward-settings"></div>
        <button class="add-row-btn" onclick="addReward()">＋ ごほうびを追加</button>
      </div>
      <button class="save-btn" onclick="saveSettings()">保存する</button>
      <div class="save-msg" id="save-msg">保存しました ✓</div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchPage('kids',this)"><span class="nav-icon">📋</span>タスク</button>
    <button class="nav-btn" onclick="switchPage('parent',this)"><span class="nav-icon">👀</span>確認</button>
    <button class="nav-btn" onclick="switchPage('calendar',this)"><span class="nav-icon">📅</span>記録</button>
    <button class="nav-btn" onclick="switchPage('rewards',this)"><span class="nav-icon">🎁</span>ごほうび</button>
    <button class="nav-btn" onclick="switchPage('settings',this)"><span class="nav-icon">⚙️</span>設定</button>
  </nav>
</div>

// =====================
// Data & State
// =====================
const CHILDREN = ["琴音","心桜","陽斗"];
const DEFAULT_STAMPS = {"琴音":"🌸","心桜":"🌈","陽斗":"🌟"};
const STAMPS_ALL = ["⭐","🌟","🎉","🌈","🦄","🐸","🍀","💎","🎵","🔥","💪","🌸"];

function lsGet(key, def) { try { const v=localStorage.getItem(key); return v?JSON.parse(v):def; } catch(e) { return def; } }
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let GAS_URL = lsGet("gasUrl", "https://script.google.com/macros/s/AKfycbzaHbH3rWLeV3IqcJBeoXSzS6TRYMaGzsdK5r6zjIJpHhJaoOlMgD7OCCBnAo9nJm-c/exec");
let tasks = lsGet("tasks", [
  {id:1,name:"提出物を出す",pts:1},{id:2,name:"洗濯物を出す",pts:1},
  {id:3,name:"宿題をやる",pts:1},{id:4,name:"片づけをやる",pts:1},
  {id:5,name:"お手伝いをやる",pts:5},
]);
let rewards = lsGet("rewards", [
  {id:1,name:"ゲーム30分",icon:"🎮",cost:20},
  {id:2,name:"アイスクリーム",icon:"🍦",cost:30},
  {id:3,name:"おでかけリクエスト",icon:"🎡",cost:80},
]);
let childData = lsGet("childData", null);
if (!childData) {
  childData = {};
  CHILDREN.forEach(c => { childData[c] = {stamp:DEFAULT_STAMPS[c],points:0,history:{},claimed:[],taskState:{}}; });
}

let state = {page:"kids",child:CHILDREN[0],calChild:CHILDREN[0],rewardChild:CHILDREN[0],dateOffset:0};
let nextTid=20, nextRid=20;
let syncTimer = null;

// =====================
// GAS URL 設定
// =====================
function initUrlSetup() {
  const banner = document.getElementById("url-setup");
  if (GAS_URL) {
    banner.style.display = "none";
    setSyncStatus("ing", "接続中...");
    syncLoad();
  } else {
    banner.style.display = "block";
    setSyncStatus("err", "未設定");
  }
}

function setGasUrl() {
  const val = document.getElementById("gas-url-input").value.trim();
  if (!val.startsWith("https://script.google.com")) {
    alert("URLが正しくありません。GASのデプロイURLを貼り付けてください。");
    return;
  }
  GAS_URL = val;
  lsSet("gasUrl", GAS_URL);
  document.getElementById("url-setup").style.display = "none";
  setSyncStatus("ing", "接続中...");
  syncLoad();
}

// =====================
// Sync
// =====================
function setSyncStatus(state, label) {
  const dot = document.getElementById("sync-dot");
  dot.className = "sync-dot" + (state ? " "+state : "");
  document.getElementById("sync-label").textContent = label;
}

function gasRequest(params) {
  return new Promise((resolve, reject) => {
    if (!GAS_URL) { reject(new Error("URL未設定")); return; }
    const cbName = "cb_" + Math.random().toString(36).slice(2);
    const url = GAS_URL + "?" + Object.entries({...params, callback: cbName})
      .map(([k,v]) => encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
    const script = document.createElement("script");
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("タイムアウト"));
    }, 10000);
    window[cbName] = (data) => { cleanup(); resolve(data); };
    function cleanup() { clearTimeout(timer); delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); }
    script.onerror = () => { cleanup(); reject(new Error("接続エラー")); };
    script.src = url;
    document.head.appendChild(script);
  });
}

async function syncLoad() {
  if (!GAS_URL) return;
  setSyncStatus("ing", "読込中...");
  try {
    const data = await gasRequest({action:"load"});
    if (data.tasks) tasks = data.tasks;
    if (data.rewards) rewards = data.rewards;
    if (data.childData) {
      // マージ：ローカルの方が新しい場合はローカル優先（簡易）
      childData = data.childData;
    }
    lsSet("tasks", tasks);
    lsSet("rewards", rewards);
    lsSet("childData", childData);
    setSyncStatus("ok", "同期済み");
    render();
  } catch(e) {
    setSyncStatus("err", "エラー");
    console.error(e);
  }
}

async function syncSave() {
  if (!GAS_URL) { lsSet("tasks",tasks); lsSet("rewards",rewards); lsSet("childData",childData); return; }
  lsSet("tasks",tasks); lsSet("rewards",rewards); lsSet("childData",childData);
  setSyncStatus("ing", "保存中...");
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      await gasRequest({action:"save", data: JSON.stringify({tasks, rewards, childData})});
      setSyncStatus("ok", "同期済み");
    } catch(e) {
      setSyncStatus("err", "ローカル保存");
      console.error(e);
    }
  }, 800);
}

// =====================
// App Logic
// =====================
function saveAll() { syncSave(); }

function getDate(o=0) { const d=new Date(); d.setDate(d.getDate()+o); return d; }
function dateKey(d) { return d.toISOString().slice(0,10); }
function formatDate(d) { const days=["日","月","火","水","木","金","土"]; return `${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`; }

function switchPage(page, btn) {
  state.page=page;
  document.querySelectorAll(".page").forEach(el=>el.classList.remove("active"));
  document.getElementById("page-"+page).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(el=>el.classList.remove("active"));
  if(btn) btn.classList.add("active");
  if(page==="parent") syncLoad();
  render();
}
function buildChildTabs(id, active, fn) {
  document.getElementById(id).innerHTML = CHILDREN.map(c =>
    `<button class="child-tab ${c===active?"active":""}" onclick="${fn}('${c}')">${c}</button>`
  ).join("");
}
function switchChild(c){state.child=c;renderKids();}
function switchCalChild(c){state.calChild=c;renderCalendar();}
function switchRewardChild(c){state.rewardChild=c;renderRewards();}
function changeDate(d){state.dateOffset+=d;if(state.dateOffset>0)state.dateOffset=0;renderKids();}

function getTS(child,taskId,offset){
  const key=dateKey(getDate(offset));
  if(!childData[child])childData[child]={stamp:DEFAULT_STAMPS[child]||"⭐",points:0,history:{},claimed:[],taskState:{}};
  if(!childData[child].taskState[key])childData[child].taskState[key]={};
  if(!childData[child].taskState[key][taskId])childData[child].taskState[key][taskId]={done:false,parentChecked:false};
  return childData[child].taskState[key][taskId];
}
function toggleTask(child,taskId){
  const ts=getTS(child,taskId,state.dateOffset);
  const task=tasks.find(t=>t.id===taskId);
  if(!task)return;
  ts.done=!ts.done;
  if(ts.done){childData[child].points+=task.pts;}
  else{childData[child].points=Math.max(0,childData[child].points-task.pts);ts.parentChecked=false;}
  saveHistory(child); saveAll(); renderKids();
}
function parentCheck(child,taskId){
  const ts=getTS(child,taskId,0);
  if(!ts.done)return;
  ts.parentChecked=!ts.parentChecked;
  saveAll(); renderParent();
}
function setStamp(child,s){childData[child].stamp=s;saveAll();renderKids();}
function saveHistory(child){
  const key=dateKey(getDate(state.dateOffset));
  const ts=childData[child].taskState[key]||{};
  const total=tasks.length, done=tasks.filter(t=>ts[t.id]&&ts[t.id].done).length;
  childData[child].history[key]={done,total,full:done===total&&total>0};
}
function claimReward(child,rid){
  const r=rewards.find(x=>x.id===rid);
  if(!r||childData[child].points<r.cost)return;
  childData[child].points-=r.cost;
  childData[child].claimed.push(r.name);
  saveAll(); renderRewards();
}

function render(){
  if(state.page==="kids")renderKids();
  else if(state.page==="parent")renderParent();
  else if(state.page==="calendar")renderCalendar();
  else if(state.page==="rewards")renderRewards();
  else if(state.page==="settings")renderSettings();
}
function renderKids(){
  buildChildTabs("child-tabs",state.child,"switchChild");
  const child=state.child, cd=childData[child]||{};
  const d=getDate(state.dateOffset), dayKey=dateKey(d);
  const ts=(cd.taskState||{})[dayKey]||{};
  const total=tasks.length, done=tasks.filter(t=>ts[t.id]&&ts[t.id].done).length;
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById("date-label").textContent=state.dateOffset===0?`今日 ${formatDate(d)}`:formatDate(d);
  document.getElementById("pts-name").textContent=`${child}のポイント`;
  document.getElementById("pts-val").textContent=`${cd.points||0} pt`;
  document.getElementById("prog-fill").style.width=pct+"%";
  document.getElementById("pts-ratio").textContent=`${done}/${total}`;
  document.getElementById("task-list").innerHTML=tasks.map(t=>{
    const tstate=getTS(child,t.id,state.dateOffset);
    return `<div class="task-card ${tstate.done?"done":""} ${tstate.parentChecked?"parent-ok":""}" onclick="toggleTask('${child}',${t.id})">
      <div class="stamp-circle ${tstate.done?"done":""}">${tstate.done?(cd.stamp||"⭐"):"○"}</div>
      <div class="task-info">
        <div class="task-name ${tstate.done?"done":""}">${t.name}</div>
        <div class="task-sub">+${t.pts}pt${tstate.parentChecked?" · ✓確認済み":""}</div>
      </div>
    </div>`;
  }).join("");
  document.getElementById("stamp-picker").innerHTML=STAMPS_ALL.map(s=>
    `<div class="stamp-opt ${(cd.stamp||"⭐")===s?"selected":""}" onclick="setStamp('${child}','${s}')">${s}</div>`
  ).join("");
}
function renderParent(){
  const today=dateKey(getDate(0));
  document.getElementById("parent-list").innerHTML=CHILDREN.map(child=>{
    const cd=childData[child]||{};
    const ts=(cd.taskState||{})[today]||{};
    return `<div class="parent-card">
      <div class="parent-child-header">${child}</div>
      ${tasks.map(t=>{
        const s=ts[t.id]||{done:false,parentChecked:false};
        const icon=s.done?(s.parentChecked?"✅":"⏳"):"◻️";
        return `<div class="parent-row">
          <div class="parent-task-name">${t.name}</div>
          <div class="parent-status">${icon}</div>
          ${s.done&&!s.parentChecked?`<button class="verify-btn" onclick="parentCheck('${child}',${t.id})">確認</button>`:""}
          ${s.parentChecked?`<span class="verified-label">確認済み</span>`:""}
          ${!s.done?`<span class="undone-label">未完了</span>`:""}
        </div>`;
      }).join("")}
    </div>`;
  }).join("");
}
function renderCalendar(){
  buildChildTabs("cal-child-tabs",state.calChild,"switchCalChild");
  const child=state.calChild, cd=childData[child]||{history:{}};
  const now=new Date(), year=now.getFullYear(), month=now.getMonth();
  document.getElementById("cal-month-label").textContent=`${year}年${month+1}月の記録`;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDay=new Date(year,month,1).getDay();
  const dayLabels=["日","月","火","水","木","金","土"];
  let html=dayLabels.map(d=>`<div class="cal-day-label">${d}</div>`).join("");
  for(let i=0;i<firstDay;i++) html+="<div></div>";
  for(let day=1;day<=daysInMonth;day++){
    const key=`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const h=(cd.history||{})[key];
    const isToday=day===now.getDate();
    let cls="cal-cell"+(h?(h.full?" full":" partial"):" empty-day")+(isToday?" today":"");
    html+=`<div class="${cls}">${day}</div>`;
  }
  document.getElementById("cal-grid").innerHTML=html;
  const hist=cd.history||{};
  const fullDays=Object.values(hist).filter(h=>h.full).length;
  const totalDays=Object.keys(hist).length;
  document.getElementById("month-stats").innerHTML=`
    <div class="stat-card"><div class="stat-val">${cd.points||0}</div><div class="stat-label">合計ポイント</div></div>
    <div class="stat-card"><div class="stat-val">${fullDays}</div><div class="stat-label">全完了日数</div></div>
    <div class="stat-card"><div class="stat-val">${totalDays}</div><div class="stat-label">記録日数</div></div>`;
}
function renderRewards(){
  buildChildTabs("reward-child-tabs",state.rewardChild,"switchRewardChild");
  const child=state.rewardChild, cd=childData[child]||{};
  document.getElementById("reward-pts").textContent=`${cd.points||0} pt`;
  document.getElementById("reward-list").innerHTML=rewards.map(r=>{
    const can=(cd.points||0)>=r.cost;
    const cnt=(cd.claimed||[]).filter(x=>x===r.name).length;
    return `<div class="reward-card">
      <div class="reward-icon">${r.icon}</div>
      <div class="reward-name">${r.name}${cnt>0?` <span style="font-size:12px;color:var(--success);">×${cnt}</span>`:""}</div>
      <div class="reward-cost">${r.cost}pt</div>
      <button class="exchange-btn ${can?"can":""}" onclick="${can?`claimReward('${child}',${r.id})`:""}">${can?"交換":"もう少し"}</button>
    </div>`;
  }).join("");
}
function renderSettings(){
  document.getElementById("task-settings").innerHTML=tasks.map(t=>
    `<div class="settings-row">
      <input type="text" value="${t.name}" id="tn-${t.id}" placeholder="タスク名"/>
      <input type="number" value="${t.pts}" id="tp-${t.id}" min="1" max="99"/>
      <span class="pts-unit">pt</span>
      <button class="del-btn" onclick="delTask(${t.id})">🗑</button>
    </div>`
  ).join("");
  document.getElementById("reward-settings").innerHTML=rewards.map(r=>
    `<div class="settings-row">
      <input type="text" value="${r.icon}" id="ri-${r.id}" style="width:48px;text-align:center;" placeholder="🎁"/>
      <input type="text" value="${r.name}" id="rn-${r.id}" placeholder="ごほうび名"/>
      <input type="number" value="${r.cost}" id="rc-${r.id}" min="1" max="999"/>
      <span class="pts-unit">pt</span>
      <button class="del-btn" onclick="delReward(${r.id})">🗑</button>
    </div>`
  ).join("");
}
function addTask(){tasks.push({id:nextTid++,name:"新しいタスク",pts:1});renderSettings();}
function delTask(id){tasks=tasks.filter(t=>t.id!==id);renderSettings();}
function addReward(){rewards.push({id:nextRid++,name:"新しいごほうび",icon:"🎁",cost:10});renderSettings();}
function delReward(id){rewards=rewards.filter(r=>r.id!==id);renderSettings();}
function saveSettings(){
  tasks=tasks.map(t=>({...t,name:document.getElementById(`tn-${t.id}`)?.value.trim()||t.name,pts:parseInt(document.getElementById(`tp-${t.id}`)?.value)||t.pts})).filter(t=>t.name);
  rewards=rewards.map(r=>({...r,icon:document.getElementById(`ri-${r.id}`)?.value.trim()||r.icon,name:document.getElementById(`rn-${r.id}`)?.value.trim()||r.name,cost:parseInt(document.getElementById(`rc-${r.id}`)?.value)||r.cost})).filter(r=>r.name);
  saveAll();
  const msg=document.getElementById("save-msg");
  msg.style.display="block";
  setTimeout(()=>msg.style.display="none",2000);
  renderSettings();
}

initUrlSetup();
render();
</script>
</body>
